<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Spot prices</title>
  <style>
    :root {
      --bg: #f6f7f2;
      --panel: #ffffff;
      --ink: #18201c;
      --muted: #667069;
      --line: #d9dfd7;
      --green: #1f8a70;
      --shadow: 0 12px 34px rgba(31, 44, 37, 0.1);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main {
      width: min(1180px, calc(100vw - 64px));
      margin: 0 auto;
      padding: 42px 0;
    }
    .back-link {
      display: inline-flex;
      align-items: center;
      min-height: 36px;
      margin-bottom: 18px;
      color: var(--ink);
      font-weight: 800;
      text-decoration: none;
    }
    h1 {
      margin: 0;
      font-size: clamp(34px, 6vw, 64px);
      line-height: 1;
      letter-spacing: 0;
    }
    p {
      max-width: 680px;
      margin: 14px 0 30px;
      color: var(--muted);
      font-size: 17px;
      line-height: 1.55;
    }
    .nav {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
    }
    a.card,
    .disabled-card {
      min-height: 170px;
      display: grid;
      align-content: space-between;
      gap: 18px;
      padding: 22px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      color: inherit;
      text-decoration: none;
      box-shadow: var(--shadow);
    }
    a.card:hover,
    a.card:focus-visible {
      border-color: var(--green);
      outline: none;
    }
    .disabled-card {
      opacity: 0.58;
      cursor: default;
    }
    strong {
      font-size: 28px;
      line-height: 1.15;
    }
    .hourly-panel{margin-top:24px;padding:22px;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}.hourly-head{display:flex;justify-content:space-between;align-items:flex-end;gap:18px;margin-bottom:16px}.section-kicker{color:var(--green);font-size:10px;font-weight:850;letter-spacing:.16em}.hourly-head h2{margin:7px 0 4px;font-size:25px;letter-spacing:-.03em}.hourly-head p{margin:0;max-width:620px;font-size:13px}.hourly-controls{display:grid;grid-template-columns:repeat(3,minmax(130px,1fr));gap:10px;margin-bottom:12px}.hourly-controls label{display:grid;gap:6px;color:var(--muted);font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}.hourly-controls select,.hourly-controls input{min-height:40px;width:100%;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);padding:0 10px;font:inherit}.hourly-controls button{min-height:40px;border:0;border-radius:8px;background:var(--green);color:#fff;padding:0 14px;font-weight:800;cursor:pointer}.hourly-options{display:flex;flex-wrap:wrap;gap:16px;margin:3px 0 12px;color:var(--muted);font-size:12px}.hourly-options label{display:flex;align-items:center;gap:7px;cursor:pointer}.hourly-options input{accent-color:var(--green)}.hourly-chart{min-height:280px}.hourly-chart svg{display:block;width:100%;height:auto}.hourly-table{max-height:280px;overflow:auto;border:1px solid var(--line);border-radius:8px}.hourly-table table{width:100%;border-collapse:collapse;font-size:12px}.hourly-table th,.hourly-table td{padding:9px 11px;border-bottom:1px solid var(--line);text-align:left}.hourly-table th{position:sticky;top:0;background:#f8faf7;color:var(--muted);font-size:10px;text-transform:uppercase;z-index:1}.hourly-note{margin:10px 0 0;color:var(--muted);font-size:11px;line-height:1.55}
    span {
      color: var(--muted);
      line-height: 1.45;
    }
    @media (max-width: 900px) {
      .nav { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 560px) {
      .nav { grid-template-columns: 1fr; }
      .hourly-head { display:block; }
      .hourly-controls { grid-template-columns:1fr; }
      .hourly-panel { padding:14px; }
    }
  
    .hourly-controls{grid-template-columns:repeat(3,minmax(180px,1fr));gap:12px}.hourly-controls select,.hourly-controls input,.hourly-controls button{min-height:42px;padding:0 12px;border-radius:8px;font-size:14px}.hourly-panel{padding:18px}
</style>
</head>
<body>
  <main>
    <section class="hourly-panel" aria-labelledby="hourlyTitle">
      <div class="hourly-head"><div><h2 id="hourlyTitle">Hourly prices</h2><p>Compare the selected day with the previous 30 days by market-local hour.</p></div></div>
      <div class="hourly-controls"><label>Country<select id="hourlyCountry"></select></label><label>Market date<input id="hourlyDate" type="date"></label><button id="hourlyLatest" type="button">Latest day</button></div>
      <div class="hourly-options"><label><input id="showHourlyRange" type="checkbox" checked> Previous 30 days · min–max</label><label><input id="showHourlyAverage" type="checkbox" checked> Previous 30 days · hourly average</label></div>
      <div id="hourlyChart" class="hourly-chart" aria-live="polite"></div>
      <p id="hourlyNote" class="hourly-note"></p>
      <div class="hourly-table"><table><thead><tr><th>Hour</th><th>Day-Ahead €/MWh</th><th>Historical average</th><th>Previous 30d min</th><th>Previous 30d max</th></tr></thead><tbody id="hourlyTableBody"></tbody></table></div>
    </section>
    <footer style="margin-top: 28px; color: #667069; font-size: 13px;">Source: Ember, Entsoe</footer>
  </main>
  <script src="data/spot_prices.js"></script><script src="data/site_meta.js"></script>
  <script src="data/spot_hourly.js"></script>
</body>
</html>
