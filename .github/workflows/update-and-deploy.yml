name: Update prices and deploy Pages + Vercel

on:
  workflow_dispatch:
  schedule:
    - cron: "0 16 * * *"
      timezone: "Europe/Rome"
  push:
    branches:
      - main
    paths:
      - "*.html"
      - "vercel.json"
      - "scripts/**"
      - "data/bess_indexes.css"
      - "data/home.css"
      - "data/home.js"
      - "data/spread_dashboard.js"
      - "data/bess_ranking.js"
      - "data/colocation.js"
      - "data/colocation.css"
      - "data/simulations_access.js"
      - "data/simulations_access.css"
      - "data/multiofftake.js"
      - "data/multiofftake_core.js"
      - "data/multiofftake.css"
      - "data/pv_profiles_source.json"
      - ".github/workflows/update-and-deploy.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Test TBx and BESS index formulas
        run: python -m unittest scripts/test_bess_indexes.py

      - name: Download prices and build dashboard data
        run: python scripts/update_prices.py

      - name: Verify generated data
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          required = (
              "spot_prices.json",
              "negative_prices.json",
              "generation_profiles.json",
              "renewable_negative_impact.json",
          )
          for filename in required:
              path = Path("data") / filename
              if not path.is_file() or path.stat().st_size == 0:
                  raise SystemExit(f"Missing or empty generated file: {path}")

          payload = json.loads((Path("data") / "spot_prices.json").read_text(encoding="utf-8"))
          profiles = json.loads((Path("data") / "generation_profiles.json").read_text(encoding="utf-8"))
          expected_iso3 = {country["iso3"] for country in payload["countries"]}
          solar = profiles["technologies"]["solar_pv"]
          actual_iso3 = set(solar.get("countries", {}))
          if solar.get("profileScope") != "country" or actual_iso3 != expected_iso3:
              raise SystemExit(
                  "Solar PV profile coverage mismatch: "
                  f"missing={sorted(expected_iso3 - actual_iso3)}, "
                  f"extra={sorted(actual_iso3 - expected_iso3)}"
              )
          colocation_dir = Path("data") / "colocation_prices"
          missing_colocation = [iso3 for iso3 in expected_iso3 if not (colocation_dir / f"{iso3}.js").is_file()]
          if missing_colocation:
              raise SystemExit(f"Missing colocation price files: {sorted(missing_colocation)}")
          spread_order = [
              "tb1Spread", "tb2Spread", "tb4Spread",
              "bess2hOneCycleSpread", "bess2hTwoCycleSpread",
          ]
          valid_days = [
              day
              for country in payload["series"].values()
              for year in country["years"].values()
              for month in year["months"].values()
              for day in month["days"]
              if day.get("spreadIndexes", [None])[0] is not None
          ]
          if payload.get("spreadIndexOrder") != spread_order or not valid_days or len(valid_days[0]["spreadIndexes"]) != 5:
              raise SystemExit("Missing TBx or BESS spread indicators")
          dispatch_profiles = [
              month.get("bessDispatchProfiles")
              for country in payload["series"].values()
              for year in country["years"].values()
              for month in year["months"].values()
          ]
          for profile in dispatch_profiles:
              if (
                  not isinstance(profile, list) or len(profile) != 2
                  or any(not isinstance(plan, list) or len(plan) != 2 for plan in profile)
                  or any(len(series) != 24 for plan in profile for series in plan)
              ):
                  raise SystemExit("Missing or malformed monthly BESS dispatch profile")
              for plan in profile:
                  for series in plan:
                      total = sum(series)
                      if total and abs(total - 100) > 0.01:
                          raise SystemExit(f"BESS dispatch profile does not sum to 100%: {total}")
          print(f"Latest available price date: {payload.get('latestLocalDate')}")
          print(f"Rows processed: {payload.get('generatedFromRows')}")
          print(f"Country-specific solar PV profiles: {len(actual_iso3)}")
          print(f"Days with BESS index coverage: {len(valid_days)}")
          print(f"Monthly BESS dispatch profiles: {len(dispatch_profiles)}")
          PY

      - name: Verify colocation price files
        run: python scripts/validate_colocation_data.py

      - name: Assemble static site
        run: |
          mkdir _site
          cp ./*.html _site/
          cp -R data _site/data
          touch _site/.nojekyll

      - name: Upload generated site for Vercel
        uses: actions/upload-artifact@v4
        with:
          name: vercel-site
          path: _site/
          if-no-files-found: error
          retention-days: 1

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  deploy-vercel:
    name: Deploy generated site to Vercel
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Check required Vercel secrets
        shell: bash
        run: |
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing repository Actions secret: $name"
              exit 1
            fi
          done

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Download generated site
        uses: actions/download-artifact@v4
        with:
          name: vercel-site
          path: .vercel/output/static

      - name: Link deployment to the configured Vercel project
        shell: bash
        run: |
          mkdir -p .vercel
          node -e 'const fs=require("node:fs"); fs.writeFileSync(".vercel/project.json", JSON.stringify({projectId: process.env.VERCEL_PROJECT_ID, orgId: process.env.VERCEL_ORG_ID}));'

      - name: Prepare static Vercel Build Output
        shell: bash
        run: |
          test -s .vercel/output/static/index.html
          test -s .vercel/output/static/data/spot_prices.js
          test -s .vercel/output/static/data/colocation_prices/DEU.js
          node -e 'require("node:fs").writeFileSync(".vercel/output/config.json", JSON.stringify({version: 3}))'

      - name: Deploy to Vercel production
        shell: bash
        run: |
          vercel deploy --prebuilt --prod --yes --token="$VERCEL_TOKEN" > deployment-url.txt
          deployment_url="$(tail -n 1 deployment-url.txt)"
          if [[ ! "$deployment_url" =~ ^https://[a-zA-Z0-9.-]+\.vercel\.app$ ]]; then
            echo "::error::Vercel did not return the expected deployment URL."
            exit 1
          fi
          echo "### Vercel production deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "$deployment_url" >> "$GITHUB_STEP_SUMMARY"
          echo "Published the generated site from this workflow run (commit $GITHUB_SHA)." >> "$GITHUB_STEP_SUMMARY"
